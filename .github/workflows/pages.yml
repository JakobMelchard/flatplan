name: pages

on: { push: { branches: [main] } }

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Stage the static app and a version stamp for the in-app update check
        run: |
          mkdir site
          cp -r index.html sw.js manifest.webmanifest icons src site
          printf '{"version":"%s","debug":false}\n' "$(git log -1 --format='%h %s')" > site/version
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
