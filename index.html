<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="flatplan" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="tokens.css" />
<title>flatplan</title>
<style>
  /* app aliases over the org tokens (tokens.css: --bg --card --fg --muted --accent --line ...) */
  :root { --panel:var(--card); --panel2:var(--glass); --line2:color-mix(in srgb, var(--muted) 45%, transparent); --dim:color-mix(in srgb, var(--fg) 70%, var(--muted)); --mute:var(--muted); --acc:var(--accent); --acc2:color-mix(in srgb, var(--accent) 16%, transparent); --accfg:var(--bg); --danger2:color-mix(in srgb, var(--danger) 16%, transparent); --ctl:var(--hover); --tip:var(--bg); --h:32px; --r:var(--radius-md); --sh:0 1px 2px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.4) }
  * { box-sizing:border-box; margin:0 }
  [hidden] { display:none !important }
  html, body { height:100% }
  body { display:grid; grid-template-rows:calc(52px + env(safe-area-inset-top)) 1fr; grid-template-columns:280px 1fr 288px; grid-template-areas:"top top top" "left main right"; font:13px/1.4 var(--font); color:var(--fg); background:var(--bg); overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; overscroll-behavior:none }
  body.no-left { grid-template-columns:0 1fr 288px } body.no-right { grid-template-columns:280px 1fr 0 } body.no-left.no-right { grid-template-columns:0 1fr 0 }
  body.no-left #left, body.no-right #right { visibility:hidden }
  input { -webkit-user-select:text; user-select:text }
  button, input, select { font:inherit; color:inherit }
  button { cursor:pointer; background:none; border:0; padding:0 }

  /* ---------- header ---------- */
  header { grid-area:top; display:flex; align-items:center; gap:12px; padding:env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); background:var(--panel); border-bottom:1px solid var(--line) }
  .brand { font-weight:700; letter-spacing:-.02em; font-size:15px; display:flex; align-items:center; gap:8px }
  .brand i { width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,var(--accent),var(--purple)); display:inline-block }
  .tabs { display:flex; align-items:center; gap:2px; flex:1; min-width:0; overflow-x:auto }
  .tab { display:flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:var(--r); color:var(--dim); white-space:nowrap; font-weight:500 }
  .tab:hover { background:var(--ctl); color:var(--fg) }
  .tab.on { background:var(--acc2); color:var(--acc) }
  .tab .x { width:18px; height:18px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; color:inherit; opacity:.6 } .tab .x:hover { opacity:1; background:var(--ghost) }
  .tab.add { padding:0 8px; font-size:16px }
  .tab svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .hgroup { display:flex; gap:6px }

  /* ---------- buttons ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--h); padding:0 12px; border-radius:var(--r); border:1px solid var(--line2); background:var(--panel2); font-weight:500; white-space:nowrap; user-select:none }
  .btn:hover { background:var(--ctl) }
  .btn.ghost { border-color:transparent; background:none; color:var(--dim) } .btn.ghost:hover { background:var(--ctl); color:var(--fg) }
  .btn.pri { background:var(--acc); border-color:var(--acc); color:var(--accfg) } .btn.pri:hover { background:color-mix(in srgb, var(--accent) 80%, var(--fg)) }
  .btn.danger { color:var(--danger) } .btn.danger:hover { background:var(--danger2) }
  .btn.icon { width:var(--h); padding:0 }
  .btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .btn.block { width:100% }

  /* ---------- side panels ---------- */
  aside { background:var(--panel); display:flex; flex-direction:column; min-height:0 }
  #left { grid-area:left; border-right:1px solid var(--line) }
  #right { grid-area:right; border-left:1px solid var(--line); overflow-y:auto }
  .ph { display:flex; align-items:center; justify-content:space-between; height:48px; padding:0 16px; border-bottom:1px solid var(--line) }
  .ph h2 { font-size:13px; font-weight:600 }
  .sec { padding:16px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--line) }
  .sec:last-child { border-bottom:0 }
  .sec h3 { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--mute) }
  .hint { color:var(--dim); font-size:12px; line-height:1.5 }
  .hint kbd { display:inline-block; min-width:18px; padding:0 5px; border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; font:11px var(--font-mono); color:var(--fg); background:var(--panel2); text-align:center }

  /* catalog */
  .cards { flex:1; overflow-y:auto; padding:8px }
  .card { display:grid; grid-template-columns:44px minmax(0, 1fr) auto; gap:12px; align-items:center; padding:8px; border-radius:10px; cursor:grab; border:1px solid transparent }
  .card:hover { background:var(--ctl) }
  .card .th { width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:var(--bg); border-radius:8px; border:1px solid var(--line) }
  .card .th i { display:block; border-radius:2px; background-size:cover; box-shadow:inset 0 0 0 1px var(--ghost) }
  .card b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .card small { color:var(--dim); font-variant-numeric:tabular-nums }
  .card .act { display:flex; gap:4px; opacity:0 } .card:hover .act { opacity:1 }
  .card .act .btn { height:28px; width:28px }
  .empty { padding:32px 16px; text-align:center; color:var(--dim); font-size:12.5px; line-height:1.6 }

  /* forms */
  .field { display:flex; flex-direction:column; gap:5px }
  .field > span { font-size:12px; color:var(--dim); font-weight:500 }
  .in { display:flex; align-items:center; height:var(--h); border:1px solid var(--line2); border-radius:var(--r); background:var(--bg); overflow:hidden }
  .in:focus-within { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc2) }
  ::selection { background:var(--acc2) }
  .in input { flex:1; width:0; min-width:0; height:100%; padding:0 10px; border:0; background:none; outline:none; font-variant-numeric:tabular-nums }
  .in input[type=number]::-webkit-inner-spin-button { opacity:.4 }
  .in .u { padding:0 10px 0 0; color:var(--mute); font-size:12px }
  .in .pre { padding:0 0 0 10px; color:var(--mute); font-size:12px; width:32px }
  .in input[type=color] { padding:4px; width:100%; cursor:pointer }
  input[type=range] { width:100%; accent-color:var(--acc) }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px } .g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px } .g2 > *, .g3 > * { min-width:0 }
  .seg { display:inline-flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden; background:var(--panel2) }
  .seg .btn { border:0; border-radius:0; flex:1 } .seg .btn + .btn { border-left:1px solid var(--line) }
  input[type=file] { display:none }
  .title { font-weight:600; font-size:14px } .sub { color:var(--dim); font-size:12px }
  .warn { color:var(--danger) }

  /* ---------- canvas ---------- */
  main { grid-area:main; position:relative; overflow:hidden }
  canvas { display:block; width:100%; height:100%; touch-action:none }
  .float { position:absolute; display:flex; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--sh); padding:4px }
  #toolbar { top:12px; left:50%; transform:translateX(-50%); gap:2px }
  #toolbar .tool { width:36px; height:36px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--dim); position:relative }
  #toolbar .tool:hover { background:var(--ctl); color:var(--fg) }
  #toolbar .tool.on { background:var(--acc2); color:var(--acc) }
  #toolbar .tool svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
  #toolbar .tool::after { content:attr(data-tip); position:absolute; top:44px; left:50%; transform:translateX(-50%); background:var(--tip); color:var(--fg); border:1px solid var(--line); font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .1s }
  @media (hover:hover) { #toolbar .tool:hover::after { opacity:1 } }
  #toolbar .sep { width:1px; height:22px; background:var(--line); margin:0 4px }
  #zoomer { right:12px; bottom:12px; gap:2px; padding:3px }
  #zoomer .btn { height:30px; border:0; background:none } #zoomer .btn:hover { background:var(--ctl) }
  #zoomer .btn.icon { width:30px }
  #zoomer .pct { min-width:52px; text-align:center; color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px }
  #status { left:12px; bottom:12px; padding:0 10px; height:30px; gap:10px; font-size:12px; color:var(--dim); max-width:calc(100% - 200px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  #status b { color:var(--fg); font-weight:600 } #status .c { font-variant-numeric:tabular-nums; color:var(--accent) }

  /* ---------- dialog ---------- */
  dialog { margin:auto; border:1px solid var(--line); border-radius:14px; padding:0; width:380px; background:var(--panel); box-shadow:var(--shadow-overlay); color:var(--fg) }
  dialog::backdrop { background:var(--scrim) }
  dialog form { display:flex; flex-direction:column; gap:14px; padding:20px }
  dialog .dh { display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:15px }
  dialog .df { display:flex; gap:8px; justify-content:flex-end; margin-top:4px }
  dialog .df .btn.danger { margin-right:auto }
  dialog.help { width:min(1040px, calc(100vw - 48px)) }
  dialog.help .dh { padding:18px 20px 6px }
  .hgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px 28px; padding:12px 20px 16px }
  .hcol { display:flex; flex-direction:column; gap:8px }
  .hcol h3 { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--acc) }
  .hrow { display:grid; grid-template-columns:132px 1fr; gap:10px; font-size:12px; color:var(--dim); align-items:start }
  .hrow > span:first-child { color:var(--fg); font-size:11px; line-height:1.7 }
  .hrow kbd { display:inline-block; min-width:18px; padding:0 5px; border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; font:11px var(--font-mono); color:var(--fg); background:var(--panel2); text-align:center }
  @media (max-width:900px) { .hgrid { grid-template-columns:1fr 1fr } }
  @media (max-width:600px) { .hgrid { grid-template-columns:1fr } .hrow { grid-template-columns:110px 1fr } }
  .hint.foot { padding:0 20px 18px }
  .row { display:flex; gap:6px; min-width:0 } .row > label { flex:1; min-width:0; overflow:hidden } .row > button { flex:none }

  /* ---------- touch ---------- */
  .cards { touch-action:pan-y }
  .dragging { position:fixed; left:0; top:0; z-index:50; display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; background:var(--panel); border:1px solid var(--acc); border-radius:10px; box-shadow:var(--sh); pointer-events:none }
  #actions { bottom:calc(56px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); gap:4px; max-width:calc(100% - 24px); overflow-x:auto }
  #actions .btn { border:0; background:none; flex:none } #actions .btn:hover { background:var(--ctl) } #actions .btn.pri { background:var(--acc) }
  #actions .sep { width:1px; height:22px; background:var(--line); margin:0 2px; flex:none }
  #actions .in.len { width:112px; flex:none }
  #toast { bottom:calc(112px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); gap:6px; padding:4px 4px 4px 14px; color:var(--dim) }
  #toast .btn { color:var(--acc) }
  #actions .count { min-width:28px; height:24px; padding:0 8px; border-radius:12px; background:var(--acc2); color:var(--acc); font-weight:600; display:inline-flex; align-items:center; justify-content:center; flex:none }
  #toolbar .tool:disabled { opacity:.35; cursor:default } #toolbar .tool:disabled:hover { background:none }
  #zoomer { right:max(12px, env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom)) }
  #status { left:max(12px, env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)) }
  @media (hover:none) { .card .act { opacity:1 } }
  @media (pointer:coarse) {
    :root { --h:40px }
    #toolbar .tool { width:44px; height:44px }
    #zoomer .btn { height:40px } #zoomer .btn.icon { width:40px }
    .tab { height:40px }
    .card .act .btn { width:40px; height:40px }
    .in input { font-size:16px } /* below 16px iOS zooms the page on focus */
  }

  /* narrow (iPad portrait, split view): side panels become drawers over the canvas */
  @media (max-width:1200px) {
    body, body.no-left, body.no-right { grid-template-columns:0 1fr 0 }
    aside { position:fixed; top:calc(52px + env(safe-area-inset-top)); bottom:0; z-index:20; width:min(320px, 85vw); box-shadow:var(--sh); transition:transform .2s }
    #left { left:0; padding-left:env(safe-area-inset-left) } #right { right:0; padding-right:env(safe-area-inset-right) }
    body.no-left #left { transform:translateX(-105%) } body.no-right #right { transform:translateX(105%) }
    body.no-left #left, body.no-right #right { visibility:visible }
    .brand span, .btn.wide > span, .btn.wide { font-size:0; gap:0 } .btn.wide { width:var(--h); padding:0 }
    #status { max-width:calc(100% - 260px) }
  }
  @media (max-width:700px) { #status { display:none } .brand { display:none } }
</style>
</head>
<body>
<header id="top"></header>
<aside id="left"></aside>
<main>
  <canvas id="c"></canvas>
  <div id="toolbar" class="float"></div>
  <div id="status" class="float"></div>
  <div id="zoomer" class="float"></div>
  <div id="actions" class="float" hidden></div>
  <div id="toast" class="float" hidden></div>
</main>
<aside id="right"></aside>
<script type="module" src="src/main.js"></script>
</body>
</html>
