name: feedback

# Issues labeled `feedback` (the in-app Feedback button opens the form) are triaged by the
# nightly sweep routine. Only owners, members and collaborators are heard: anyone else's issue
# is closed and locked, so a public repo stays contributors-only regardless of GitHub's
# six-month interaction limits.

permissions:
  contents: read
  issues: write

on:
  issues:
    types: [labeled]

jobs:
  refuse:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'feedback' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE" --comment "Feedback here is limited to collaborators of this repository." --reason "not planned"
          gh issue lock "$ISSUE" --reason spam
