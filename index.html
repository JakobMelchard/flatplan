<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>flatplan</title>
<style>
  :root { --bg:#1e1f22; --panel:#26282c; --line:#3a3d42; --fg:#e6e6e6; --dim:#9aa0a6; --acc:#4f8cff; }
  * { box-sizing:border-box }
  body { margin:0; height:100vh; display:grid; grid-template-columns:300px 1fr; font:13px system-ui,sans-serif; background:var(--bg); color:var(--fg) }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:14px }
  main { position:relative; overflow:hidden }
  canvas { display:block; width:100%; height:100%; touch-action:none }
  h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim) }
  section { display:flex; flex-direction:column; gap:6px }
  .row { display:flex; gap:6px; align-items:center }
  .row > * { flex:1; min-width:0 }
  input, select, button { font:inherit; color:var(--fg); background:#1a1b1e; border:1px solid var(--line); border-radius:4px; padding:5px 7px }
  input[type=color] { padding:0; height:28px }
  input[type=file] { display:none }
  button { cursor:pointer; background:#33363b }
  button:hover { background:#3d4046 }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff }
  label.file { display:inline-block; cursor:pointer; background:#33363b; border:1px solid var(--line); border-radius:4px; padding:5px 7px; text-align:center }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px }
  li { display:flex; align-items:center; gap:6px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; cursor:grab; background:#1a1b1e }
  li.on { border-color:var(--acc) }
  li .sw { width:14px; height:14px; border-radius:3px; flex:none; background-size:cover }
  li span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  li small { color:var(--dim) }
  #status { position:absolute; left:8px; bottom:8px; color:var(--dim); font-size:12px; pointer-events:none; white-space:pre }
  #tools { position:absolute; top:8px; left:8px; display:flex; gap:4px }
  kbd { color:var(--dim) }
</style>
</head>
<body>
<aside id="side"></aside>
<main>
  <canvas id="c"></canvas>
  <div id="tools"></div>
  <div id="status"></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
