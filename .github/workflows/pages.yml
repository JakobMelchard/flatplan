name: pages

on: { push: { branches: [main] } }

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the docs at the site root # HonKit resolves a relative output path against the book root
        run: npx --yes honkit build docs "$PWD/site"
      - name: Stage the app under /app with a version stamp for the in-app update check
        run: |
          mkdir site/app
          cp -r index.html tokens.css sw.js manifest.webmanifest icons src site/app
          printf '{"version":"%s","debug":false}\n' "$(git log -1 --format='%h %s')" > site/app/version
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
