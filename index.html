<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>flatplan</title>
<style>
  :root { --bg:#eef0f3; --panel:#fff; --line:#e4e7ec; --line2:#d3d7de; --fg:#161a22; --dim:#6b7280; --mute:#9aa1ab; --acc:#2f6bff; --acc2:#e8efff; --danger:#dc2626; --ctl:#f5f6f8; --h:32px; --r:8px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1) }
  * { box-sizing:border-box; margin:0 }
  [hidden] { display:none !important }
  html, body { height:100% }
  body { display:grid; grid-template-rows:52px 1fr; grid-template-columns:280px 1fr 288px; grid-template-areas:"top top top" "left main right"; font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); overflow:hidden; -webkit-font-smoothing:antialiased }
  button, input, select { font:inherit; color:inherit }
  button { cursor:pointer; background:none; border:0; padding:0 }

  /* ---------- header ---------- */
  header { grid-area:top; display:flex; align-items:center; gap:20px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line) }
  .brand { font-weight:700; letter-spacing:-.02em; font-size:15px; display:flex; align-items:center; gap:8px }
  .brand i { width:20px; height:20px; border-radius:6px; background:var(--acc); display:inline-block }
  .tabs { display:flex; align-items:center; gap:2px; flex:1; min-width:0; overflow-x:auto }
  .tab { display:flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:var(--r); color:var(--dim); white-space:nowrap; font-weight:500 }
  .tab:hover { background:var(--ctl); color:var(--fg) }
  .tab.on { background:var(--acc2); color:var(--acc) }
  .tab .x { width:18px; height:18px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; color:inherit; opacity:.6 } .tab .x:hover { opacity:1; background:#fff8 }
  .tab.add { padding:0 8px; font-size:16px }
  .tab svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .hgroup { display:flex; gap:6px }

  /* ---------- buttons ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--h); padding:0 12px; border-radius:var(--r); border:1px solid var(--line2); background:#fff; font-weight:500; white-space:nowrap; user-select:none }
  .btn:hover { background:var(--ctl) }
  .btn.ghost { border-color:transparent; background:none; color:var(--dim) } .btn.ghost:hover { background:var(--ctl); color:var(--fg) }
  .btn.pri { background:var(--acc); border-color:var(--acc); color:#fff } .btn.pri:hover { background:#255ae0 }
  .btn.danger { color:var(--danger) } .btn.danger:hover { background:#fef2f2 }
  .btn.icon { width:var(--h); padding:0 }
  .btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .btn.block { width:100% }

  /* ---------- side panels ---------- */
  aside { background:var(--panel); display:flex; flex-direction:column; min-height:0 }
  #left { grid-area:left; border-right:1px solid var(--line) }
  #right { grid-area:right; border-left:1px solid var(--line); overflow-y:auto }
  .ph { display:flex; align-items:center; justify-content:space-between; height:48px; padding:0 16px; border-bottom:1px solid var(--line) }
  .ph h2 { font-size:13px; font-weight:600 }
  .sec { padding:16px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--line) }
  .sec:last-child { border-bottom:0 }
  .sec h3 { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--mute) }
  .hint { color:var(--dim); font-size:12px; line-height:1.5 }
  .hint kbd { display:inline-block; min-width:18px; padding:0 5px; border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; font:11px ui-monospace,Menlo,monospace; color:var(--fg); background:#fff; text-align:center }

  /* catalog */
  .cards { flex:1; overflow-y:auto; padding:8px }
  .card { display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; padding:8px; border-radius:10px; cursor:grab; border:1px solid transparent }
  .card:hover { background:var(--ctl) }
  .card .th { width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:#f0f2f5; border-radius:8px; border:1px solid var(--line) }
  .card .th i { display:block; border-radius:2px; background-size:cover; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15) }
  .card b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .card small { color:var(--dim); font-variant-numeric:tabular-nums }
  .card .act { display:flex; gap:4px; opacity:0 } .card:hover .act { opacity:1 }
  .card .act .btn { height:28px; width:28px }
  .empty { padding:32px 16px; text-align:center; color:var(--dim); font-size:12.5px; line-height:1.6 }

  /* forms */
  .field { display:flex; flex-direction:column; gap:5px }
  .field > span { font-size:12px; color:var(--dim); font-weight:500 }
  .in { display:flex; align-items:center; height:var(--h); border:1px solid var(--line2); border-radius:var(--r); background:#fff; overflow:hidden }
  .in:focus-within { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc2) }
  .in input { flex:1; width:0; min-width:0; height:100%; padding:0 10px; border:0; background:none; outline:none; font-variant-numeric:tabular-nums }
  .in input[type=number]::-webkit-inner-spin-button { opacity:.4 }
  .in .u { padding:0 10px 0 0; color:var(--mute); font-size:12px }
  .in .pre { padding:0 0 0 10px; color:var(--mute); font-size:12px; width:32px }
  .in input[type=color] { padding:4px; width:100%; cursor:pointer }
  input[type=range] { width:100%; accent-color:var(--acc) }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px } .g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px } .g2 > *, .g3 > * { min-width:0 }
  .seg { display:inline-flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden; background:#fff }
  .seg .btn { border:0; border-radius:0; flex:1 } .seg .btn + .btn { border-left:1px solid var(--line) }
  input[type=file] { display:none }
  .title { font-weight:600; font-size:14px } .sub { color:var(--dim); font-size:12px }
  .warn { color:var(--danger) }

  /* ---------- canvas ---------- */
  main { grid-area:main; position:relative; overflow:hidden }
  canvas { display:block; width:100%; height:100%; touch-action:none }
  .float { position:absolute; display:flex; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--sh); padding:4px }
  #toolbar { top:12px; left:50%; transform:translateX(-50%); gap:2px }
  #toolbar .tool { width:36px; height:36px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--dim); position:relative }
  #toolbar .tool:hover { background:var(--ctl); color:var(--fg) }
  #toolbar .tool.on { background:var(--acc2); color:var(--acc) }
  #toolbar .tool svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
  #toolbar .tool::after { content:attr(data-tip); position:absolute; top:44px; left:50%; transform:translateX(-50%); background:#1f2430; color:#fff; font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .1s }
  #toolbar .tool:hover::after { opacity:1 }
  #toolbar .sep { width:1px; height:22px; background:var(--line); margin:0 4px }
  #zoomer { right:12px; bottom:12px; gap:2px; padding:3px }
  #zoomer .btn { height:30px; border:0; background:none } #zoomer .btn:hover { background:var(--ctl) }
  #zoomer .btn.icon { width:30px }
  #zoomer .pct { min-width:52px; text-align:center; color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px }
  #status { left:12px; bottom:12px; padding:0 10px; height:30px; gap:10px; font-size:12px; color:var(--dim); max-width:calc(100% - 200px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  #status b { color:var(--fg); font-weight:600 } #status .c { font-variant-numeric:tabular-nums; color:var(--mute) }

  /* ---------- dialog ---------- */
  dialog { margin:auto; border:0; border-radius:14px; padding:0; width:380px; box-shadow:0 20px 50px rgba(16,24,40,.25); color:var(--fg) }
  dialog::backdrop { background:rgba(16,24,40,.35) }
  dialog form { display:flex; flex-direction:column; gap:14px; padding:20px }
  dialog .dh { display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:15px }
  dialog .df { display:flex; gap:8px; justify-content:flex-end; margin-top:4px }
  dialog .df .btn.danger { margin-right:auto }
</style>
</head>
<body>
<header id="top"></header>
<aside id="left"></aside>
<main>
  <canvas id="c"></canvas>
  <div id="toolbar" class="float"></div>
  <div id="status" class="float"></div>
  <div id="zoomer" class="float"></div>
</main>
<aside id="right"></aside>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
